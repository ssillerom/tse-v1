[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "An educational, from-scratch decoder-only transformer in PyTorch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "duckdb>=1.5.5",
    "huggingface-hub>=1.26.0",
    "numpy>=2.5.1",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "wandb>=0.22.0",
]

[project.scripts]
eval-checkpoint = "src.scripts.eval_checkpoint:main"
inspect-data-slices = "src.scripts.inspect_slices:main"
prepare-data = "src.data.prepare_data:main"
train-v1 = "src.scripts.train_v1:main"

[project.optional-dependencies]
eval = [
    "lm-eval>=0.4.12,<0.5",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/test", "src/integration_tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/data", "src/evaluation", "src/scripts", "src/training"]

[[tool.mypy.overrides]]
module = ["lm_eval", "lm_eval.*"]
ignore_missing_imports = true
