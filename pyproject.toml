[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "An educational, from-scratch decoder-only transformer in PyTorch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "python-dotenv>=1.2.2",
    "torch>=2.13.0",
    "wandb>=0.28.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmfs"]

[tool.pytest.ini_options]
testpaths = ["src/test", "src/integration_tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/llmfs", "src/scripts", "tools"]
